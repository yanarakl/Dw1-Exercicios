<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dogao.css">
</head>
<body>
    <header>
        <h3>Dogão</h3>
    </header>
    <main>
    <section>
    <label for="InputBasico" id="LabelBasico">Cachorro Quente Básico</label>
    <label for="InputBasico" id="LabelPrecoBasico">22.00</label>
    <input type="number" min="0" id="InputBasico">
    <br>
    <label for="InputDuplo" id="LabelDuplo">Cachorro Quente Duplo</label>
    <label for="InputDuplo" id="LabelPrecoDuplo">26.00</label>
    <input type="number" min="0" id="InputDuplo">
    <br>
    <label for="InputSalada" id="LabelSalada">X-Salada</label>
    <label for="InputSalada" id="LabelPrecoSalada">29.00</label>
    <input type="number" min="0" id="InputSalada">
    <br>
    <label for="InputRefriP" id="LabelRefriP">Refrigerante 350ml</label>
    <label for="InputRefriP" id="LabelPrecoRefriP">5.00</label>
    <input type="number" min="0" id="InputRefriP">
    <br>
    <label for="InputRefriG" id="LabelRefriG">Refrigerante 1L</label>
    <label for="InputRefriG" id="LabelPrecoRefriG">8.00</label>
    <input type="number" min="0" id="InputRefriG">
    </section>

    <section>
    <label for="InputTotal" id="LabelTotal">Total</label>
    <span id="InputTotal"></span>
    </section>
    </main>
    <script src="dogao.js"></script>
</body>
</html>
